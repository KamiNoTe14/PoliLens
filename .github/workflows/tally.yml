# Adds new anonymous submissions to the totals every few minutes.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT (see README). Until it's set,
# each run exits immediately without doing anything.
name: Tally submissions

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub may run this later than scheduled when busy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tally
  cancel-in-progress: false

jobs:
  tally:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tally/package-lock.json
      - run: npm ci --omit=dev
        working-directory: tally
      - run: node tally.mjs
        working-directory: tally
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
